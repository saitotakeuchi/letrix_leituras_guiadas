[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wordsync"
version = "1.0.0"
description = "Karaoke Word-Sync Engine for Letrix Leituras Guiadas"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "MokLabs", email = "dev@moklabs.com" }
]
keywords = ["karaoke", "word-sync", "audio", "transcription", "whisper", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "openai>=1.0.0",
    "google-generativeai>=0.3.0",
    "anthropic>=0.18.0",
    "jinja2>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
local = [
    "openai-whisper>=20231117",
    "whisper-timestamped>=1.14.0",
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
wordsync = "wordsync.cli:app"

[project.urls]
Homepage = "https://github.com/moklabs/letrix-leituras-guiadas"
Documentation = "https://github.com/moklabs/letrix-leituras-guiadas#readme"
Repository = "https://github.com/moklabs/letrix-leituras-guiadas"

[tool.hatch.build.targets.wheel]
packages = ["wordsync"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
